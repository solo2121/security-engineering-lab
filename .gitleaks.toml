# Gitleaks configuration (optional, for manual local scans).
#
# The enforced scanner for this repository is detect-secrets (see
# .pre-commit-config.yaml and the detect-secrets-scan job in
# .github/workflows/ci.yml), which compare against .secrets.baseline.
# This file only affects people who run gitleaks by hand.
#
# Intentional lab credentials (documented in each lab's lab-credentials.md
# and in SECURITY.md) are deliberately NOT allowlisted by value or keyword,
# because broad allowlists can hide real leaks. Expect gitleaks to report lab
# bait such as the LocalStack/AWS "leaked credentials" examples, and review
# findings instead of suppressing them wholesale.

[extend]
useDefault = true

[allowlist]
description = "detect-secrets baseline stores hashes only"
paths = [
  '''\.secrets\.baseline$''',
]
