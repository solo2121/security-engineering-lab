# Local, isolated deployment. Ports bind to 127.0.0.1 only.
#
#   cp .env.example .env   # then set real keys in .env
#   docker compose up -d --build                      # secure mode (default)
#   docker compose --profile lab up -d --build        # also start the vulnerable lab
#   docker compose --profile ollama-pull run --rm ollama-pull   # once: download the models
#   docker compose --profile ollama up -d             # optional local model (set LLM_LAB_PROVIDER=ollama)
#   docker compose down -v                            # teardown
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  restart: unless-stopped

services:
  llm-lab:
    <<: *hardened
    build: .
    image: llm-lab:secure
    env_file: [.env]
    environment:
      LLM_LAB_MODE: secure
    ports: ["${LLM_LAB_BIND:-127.0.0.1}:${LLM_LAB_PORT:-8000}:8000"]
    networks: [lab-frontend, lab-backend]

  # Intentionally vulnerable training target. Never enable outside an isolated host.
  llm-lab-vulnerable:
    <<: *hardened
    profiles: [lab]
    build: .
    image: llm-lab:vulnerable
    env_file: [.env]
    environment:
      LLM_LAB_MODE: lab
    # The llm01 VM sets LLM_LAB_BIND=0.0.0.0 and LLM_LAB_VULN_PORT=8000 in .env.
    ports: ["${LLM_LAB_BIND:-127.0.0.1}:${LLM_LAB_VULN_PORT:-8001}:8000"]
    volumes: ["lab-sandbox:/app/data/sandbox"]
    # lab-backend is internal-only; it lets this service reach Ollama and nothing else.
    networks: [lab-frontend, lab-backend]

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.5.4
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: ["ollama-models:/root/.ollama"]
    networks: [lab-backend]

  # One-shot: downloads the models into the shared volume, then exits. It is the
  # only service with internet access, because the ollama service itself sits on
  # an internal-only network. Run it once:  docker compose --profile ollama-pull run --rm ollama-pull
  ollama-pull:
    profiles: [ollama-pull]
    image: ollama/ollama:0.5.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/dev/null 2>&1 &
        for i in $$(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done
        ollama pull "$${LLM_LAB_OLLAMA_MODEL:-llama3.2:1b}"
        ollama pull "$${LLM_LAB_OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    environment:
      LLM_LAB_OLLAMA_MODEL: ${LLM_LAB_OLLAMA_MODEL:-llama3.2:1b}
      LLM_LAB_OLLAMA_EMBED_MODEL: ${LLM_LAB_OLLAMA_EMBED_MODEL:-nomic-embed-text}
    volumes: ["ollama-models:/root/.ollama"]
    networks: [lab-egress]

networks:
  lab-frontend: {}
  lab-egress: {}
  lab-backend:
    internal: true

volumes:
  lab-sandbox: {}
  ollama-models: {}
