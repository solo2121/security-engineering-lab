# =============================================================================
# Security Engineering Lab — CodeQL Analysis
# =============================================================================
#
# Static analysis for the repository's Python code (tools/, scripts/, and
# the labs' Python sources). Runs on pushes and pull requests to main, and
# weekly so findings surface even when the code itself hasn't changed.
#
# This is separate from ci.yml's security-scan job (bandit), which is
# faster and gives immediate feedback on a PR; CodeQL runs a deeper,
# cross-file analysis on its own schedule.
# =============================================================================

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 06:17 UTC every Monday — off the hour to avoid the top-of-hour spike.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:python"
