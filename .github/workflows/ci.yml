# =============================================================================
# Security Engineering Lab — CI Pipeline
# =============================================================================
#
# Jobs:
#   validate-vagrantfiles  — syntax check all three Vagrantfiles
#   lint-shell-scripts     — shellcheck errors only (not warnings)
#   lint-python-scripts    — syntax check only (flake8 informational)
#   security-scan          — bandit informational only (never blocks)
#   detect-secrets-scan    — detect-secrets against .secrets.baseline
#                            (blocks only on new/unaudited findings)
#   run-tests              — pytest (Python), bats (Bash), and repo health checks
#   check-doc-links        — markdown link check (informational) + doc-index
#                            reference check (blocks — local, no network)
#
# Philosophy:
#   Only REAL errors block the build. Style warnings and security
#   findings in intentional pentest scripts are reported but do not
#   fail the pipeline.
#
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      provider:
        description: 'Vagrant provider to use on the self-hosted runner'
        required: false
        default: 'libvirt'
        type: choice
        options:
          - libvirt
          - virtualbox

# Least-privilege default: this pipeline only needs to read the repo.
# Individual jobs can widen this if a future job needs to write (e.g.
# posting a check run or comment) — none currently do.
permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: Validate all three Vagrantfiles
  # ---------------------------------------------------------------------------
  validate-vagrantfiles:
    name: Validate Vagrantfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Vagrant
        run: |
          wget -O - https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor \
                -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            libvirt-dev \
            pkg-config \
            qemu-utils \
            vagrant

      - name: Install Vagrant plugins
        run: |
          vagrant plugin install vagrant-reload
          vagrant plugin install vagrant-libvirt
          vagrant plugin list

      - name: Validate AD Pentest Vagrantfile
        run: vagrant validate
        working-directory: labs/security/active-directory/base
        env:
          VAGRANT_DEFAULT_PROVIDER: libvirt

      - name: Validate AD Pentest VLAN Vagrantfile
        run: vagrant validate
        working-directory: labs/security/active-directory/vlan-segmented
        env:
          VAGRANT_DEFAULT_PROVIDER: libvirt

      - name: Validate DevOps Lab Vagrantfile
        run: vagrant validate
        working-directory: labs/infrastructure/devops-linux-lab
        env:
          VAGRANT_DEFAULT_PROVIDER: libvirt

  # ---------------------------------------------------------------------------
  # Job 1b: Validate all three VirtualBox Vagrantfiles
  #
  # GitHub-hosted ubuntu-latest runners ship VirtualBox preinstalled, so
  # unlike the libvirt job above, no provider install step is needed here —
  # just Vagrant itself (the VirtualBox provider is built in).
  # ---------------------------------------------------------------------------
  validate-vagrantfiles-virtualbox:
    name: Validate Vagrantfiles (VirtualBox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install VirtualBox
        # GitHub-hosted ubuntu-latest runners do not ship VirtualBox
        # preinstalled. Install it from Oracle's official repository.
        # The kernel driver (vboxdrv) isn't needed for `vagrant validate`
        # (it only parses the Vagrantfile and checks the provider is
        # present), but we still install build-essential/dkms/headers so
        # the package configures cleanly.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget gnupg lsb-release build-essential dkms "linux-headers-$(uname -r)"
          wget --retry-connrefused --tries=5 --waitretry=5 -qO /tmp/oracle_vbox_2016.asc \
            https://download.virtualbox.org/virtualbox/debian/oracle_vbox_2016.asc
          grep -q 'BEGIN PGP PUBLIC KEY BLOCK' /tmp/oracle_vbox_2016.asc || {
            echo "::error::Downloaded file is not a valid PGP public key (fetch likely blocked or truncated); aborting." >&2
            exit 1
          }
          sudo gpg --yes --dearmor -o /usr/share/keyrings/oracle-virtualbox-2016.gpg /tmp/oracle_vbox_2016.asc
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] \
            https://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" \
            | sudo tee /etc/apt/sources.list.d/virtualbox.list
          sudo apt-get update -qq
          sudo apt-get install -y virtualbox
          VBoxManage --version

      - name: Install Vagrant
        run: |
          wget -O - https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor \
                -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) \
            signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq
          sudo apt-get install -y vagrant

      - name: Install Vagrant plugins
        run: |
          vagrant plugin install vagrant-reload
          vagrant plugin install vagrant-hostmanager
          vagrant plugin install vagrant-vbguest
          vagrant plugin list

      - name: Validate AD Pentest VirtualBox Vagrantfile
        # active-directory/base uses a single unified Vagrantfile
        # supporting both providers, same as vlan-segmented below.
        run: vagrant validate
        working-directory: labs/security/active-directory/base
        env:
          VAGRANT_DEFAULT_PROVIDER: virtualbox

      - name: Validate AD Pentest VLAN VirtualBox Vagrantfile
        # vlan-segmented now also uses a single unified Vagrantfile
        # supporting both providers, same as base above.
        run: vagrant validate
        working-directory: labs/security/active-directory/vlan-segmented
        env:
          VAGRANT_DEFAULT_PROVIDER: virtualbox

      - name: Validate DevOps Lab Vagrantfile (VirtualBox)
        # All three labs now use a single unified Vagrantfile supporting
        # both providers -- there is no longer a separate virtualbox/
        # subdirectory to validate anywhere in the repo.
        run: vagrant validate
        working-directory: labs/infrastructure/devops-linux-lab
        env:
          VAGRANT_DEFAULT_PROVIDER: virtualbox

  # ---------------------------------------------------------------------------
  # Job 2: Shell script linting — errors only, not style warnings
  # ---------------------------------------------------------------------------
  lint-shell-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck (errors only)
        run: |
          echo "Scanning shell scripts for errors..."
          FAILED=0
          CHECKED=0

          while IFS= read -r -d '' script; do
            CHECKED=$((CHECKED + 1))
            # SC1091 — not following sourced file (expected in lab scripts)
            # SC2086 — double quote to prevent globbing (too noisy)
            # SC2034 — variable appears unused (false positives in sourced scripts)
            # SC2155 — declare and assign separately (style, not error)
            # SC2164 — use cd ... || exit (style)
            # SC2181 — check exit code directly (style)
            # SC2207 — mapfile not available everywhere (portability warning)
            if ! shellcheck \
              --severity=error \
              --exclude=SC1091,SC2086,SC2034,SC2155,SC2164,SC2181,SC2207 \
              "$script" 2>&1; then
              echo "FAILED: $script"
              FAILED=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)

          echo "Checked $CHECKED shell scripts"
          if [ "$FAILED" -eq 1 ]; then
            echo "shellcheck found real errors — fix them before merging"
            exit 1
          fi
          echo "All shell scripts passed"

  # ---------------------------------------------------------------------------
  # Job 3: Python syntax check — style warnings are informational only
  # ---------------------------------------------------------------------------
  lint-python-scripts:
    name: Lint Python Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tools
        run: pip install flake8 --quiet

      - name: Syntax check — blocks on real errors
        run: |
          echo "Checking Python syntax..."
          FAILED=0
          CHECKED=0

          while IFS= read -r -d '' script; do
            CHECKED=$((CHECKED + 1))
            if ! python3 -m py_compile "$script" 2>&1; then
              echo "SYNTAX ERROR: $script"
              FAILED=1
            fi
          done < <(find . -name "*.py" -not -path "./.git/*" -print0)

          echo "Checked $CHECKED Python files"
          if [ "$FAILED" -eq 1 ]; then
            echo "Fix syntax errors before merging"
            exit 1
          fi
          echo "All Python files have valid syntax"

      - name: Style check — informational only (never blocks)
        run: |
          echo "Running flake8 style check (informational)..."
          flake8 \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E302,E303,W291,W293,E711,E712,\
          E128,W292,F401,E722,F811,E305 \
            --exclude=.git,__pycache__ \
            $(find . -name "*.py" -not -path "./.git/*") \
            || true
          echo "Flake8 complete (warnings above are informational)"

  # ---------------------------------------------------------------------------
  # Job 4: Bandit security scan — always informational, never blocks
  #
  # Pentest and security tooling intentionally uses patterns that bandit
  # flags (telnet, paramiko, shell=True). These are expected and reviewed.
  # The scan runs to surface unintentional issues, not to block CI.
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install bandit
        run: pip install bandit --quiet

      - name: Run bandit (informational — never blocks)
        run: |
          echo "Running bandit security scan (informational only)..."
          PY_FILES=$(find . -name "*.py" -not -path "./.git/*" | tr '\n' ' ')

          if [ -z "$PY_FILES" ]; then
            echo "No Python files found"
            exit 0
          fi

          # Run bandit but always exit 0 — findings are informational.
          # Security scripts in this repo intentionally use patterns
          # that bandit flags (telnet, paramiko, shell execution).
          # These are reviewed during code review, not blocked in CI.
          bandit \
            --recursive \
            --severity-level medium \
            --confidence-level medium \
            --exclude ./.git \
            --format txt \
            $PY_FILES 2>&1 || true

          echo "Bandit scan complete (see findings above for review)"
          exit 0

  # ---------------------------------------------------------------------------
  # Job 4a: detect-secrets — blocks only on new/unaudited findings
  #
  # .secrets.baseline already records every known intentional training
  # string in this repo (decoy AWS keys, GPP cpassword examples, lab
  # credentials, etc.). This job re-scans the tree against that baseline
  # and fails only if the scan produces a *diff* from the checked-in
  # baseline — i.e. a genuinely new, unaudited secret-like string. It does
  # not fail on anything already reviewed and recorded in the baseline.
  # ---------------------------------------------------------------------------
  detect-secrets-scan:
    name: Detect Secrets (blocks on new/unaudited findings)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tools
        # Version kept in sync with requirements-dev.txt's detect-secrets
        # floor so local installs and CI run the same tool version.
        run: pip install detect-secrets --quiet

      - name: Scan against baseline (blocks on new findings)
        run: |
          echo "Re-scanning the tree against .secrets.baseline..."

          # "generated_at" changes on every scan, and line numbers change when
          # content is inserted above an already-reviewed training example.
          # Strip both pieces of volatile metadata before comparing (jq is
          # preinstalled on GitHub-hosted runners). The finding identity,
          # including filename, detector type, and hash, remains checked.
          jq 'del(.generated_at) | .results |= with_entries(.value |= map(del(.line_number)))' .secrets.baseline > /tmp/baseline-before.json
          detect-secrets scan --baseline .secrets.baseline
          jq 'del(.generated_at) | .results |= with_entries(.value |= map(del(.line_number)))' .secrets.baseline > /tmp/baseline-after.json

          if ! diff -q /tmp/baseline-before.json /tmp/baseline-after.json > /dev/null; then
            echo
            echo "New, unaudited secret-like findings detected -- .secrets.baseline"
            echo "would change (beyond its timestamp) if this scan's output were"
            echo "committed. Review each new finding: if it is a real secret,"
            echo "remove it from the source file and rotate it. If it is"
            echo "intentional training material, regenerate and commit an"
            echo "updated .secrets.baseline."
            echo
            diff /tmp/baseline-before.json /tmp/baseline-after.json || true
            exit 1
          fi

          echo "No new or unaudited findings -- .secrets.baseline is up to date."

  # ---------------------------------------------------------------------------
  # Job 4b: Modern Python tooling — ruff/black/mypy, informational only
  #
  # flake8 (Job 3) remains the tool that's actually tuned and relied on.
  # ruff/black/mypy are offered as opt-in developer tooling (see `make
  # format` / `make typecheck`, config in pyproject.toml) and reported here
  # for visibility, but — like bandit — never block the pipeline.
  # ---------------------------------------------------------------------------
  modern-python-tooling:
    name: Ruff / Black / Mypy (informational — never blocks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tools
        run: pip install ruff black mypy --quiet

      - name: ruff check (informational)
        run: ruff check . || true

      - name: black --check (informational)
        run: black --check . || true

      - name: mypy on tools/lib (informational — the only module held to a typed standard so far)
        run: mypy tools/lib || true

  # ---------------------------------------------------------------------------
  # Job 5: Automated test suites — pytest (Python) and bats (Bash)
  # ---------------------------------------------------------------------------
  run-tests:
    name: Run Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pytest
        run: pip install pytest pytest-cov --quiet

      - name: Run Python unit tests
        run: pytest tests/python/ -v

      - name: "Python coverage report (enforced minimum: 80%)"
        run: |
          pytest tests/python/ --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats

      - name: Run Bash unit tests
        run: bats tests/bash/

      - name: Repository health validation
        run: |
          echo "Running scripts/validate_lab.py (Vagrant checks skipped — covered by the validate-vagrantfiles job)"
          python3 scripts/validate_lab.py --skip-vagrant

  # ---------------------------------------------------------------------------
  # Job 6: Markdown link check — catch broken internal doc references
  # ---------------------------------------------------------------------------
  check-doc-links:
    name: Check Doc Links and References
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check doc-index bullets/tables for dangling filenames (blocks)
        run: |
          echo "Checking backtick-quoted filenames in doc bullets/tables —"
          echo "this is local and deterministic, so unlike link-check below"
          echo "it blocks the build on a real finding."
          python3 scripts/check_doc_references.py

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.13.6

      - name: Check all markdown files for broken links (report only)
        run: |
          echo "Checking markdown links across the repo (informational only)..."
          echo "Findings are reported for review but never fail the build —"
          echo "external link rot, rate limits, and third-party site changes"
          echo "are not 'real errors' in the sense this pipeline blocks on."
          echo
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            markdown-link-check \
              --config .markdown-link-check.json \
              "$file" || true
          done < <(find . -name "*.md" -not -path "./.git/*" -print0)

          echo
          echo "Markdown link check complete (see findings above for review)"
          exit 0

  # ---------------------------------------------------------------------------
  # Job 6b: Topology diagram smoke check (informational, never blocks)
  #
  # scripts/generate_topology_diagram.py renders the segmented AD lab's
  # network diagram from a hand-maintained data mirror of the
  # Vagrantfile's VLAN_CONFIG (see that script's docstring for the sync
  # caveat). This job only confirms the script still runs and produces a
  # PNG -- it does NOT diff the output against the Vagrantfile, so it
  # catches library/API breakage, not semantic drift between the two
  # files. It does not commit the generated image anywhere; regenerating
  # and committing an updated diagram, if you want one, remains a manual
  # step.
  # ---------------------------------------------------------------------------
  topology-diagram-smoke-check:
    name: Topology Diagram Smoke Check (informational — never blocks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Graphviz and diagrams
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
          pip install diagrams --quiet

      - name: Render the segmented AD topology diagram (informational)
        run: |
          python3 scripts/generate_topology_diagram.py --output /tmp/topology-smoke-check || {
            echo "::warning::Topology diagram generation failed -- see log above. Not blocking the build."
            exit 0
          }
          echo "Topology diagram rendered successfully (not committed anywhere)."

  # ---------------------------------------------------------------------------
  # Job 6c: Ansible role linting
  #
  # Lints the DevOps lab roles under labs/infrastructure/devops-linux-lab/
  # ansible/ with ansible-lint. The directory check is kept as a guard so
  # the job skips cleanly, rather than failing, if that tree is ever moved
  # or removed.
  # ---------------------------------------------------------------------------
  lint-ansible-roles:
    name: Lint Ansible Roles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for an ansible/ directory
        id: check
        run: |
          if [ -d "labs/infrastructure/devops-linux-lab/ansible" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "labs/infrastructure/devops-linux-lab/ansible/ not found -- skipping."
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.found == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ansible-lint
        if: steps.check.outputs.found == 'true'
        run: pip install ansible-lint --quiet

      - name: Run ansible-lint
        if: steps.check.outputs.found == 'true'
        working-directory: labs/infrastructure/devops-linux-lab/ansible
        run: ansible-lint

  # ---------------------------------------------------------------------------
  # Job 7: Self-hosted smoke test — actual VM provisioning, not just syntax
  #
  # Every job above validates syntax or lints code; none of them actually
  # boot a VM, so "provisioning drift" (a script that's valid but fails
  # during real execution) goes uncaught until someone runs `vagrant up`
  # by hand. This job closes that gap for the DevOps/K3s lab's minimal
  # profile: boot devops-1 and worker-1, wait for the k3s service to come
  # up, confirm the node reports Ready via kubectl, then tear the VMs down.
  #
  # SECURITY: this job requires a self-hosted runner with nested
  # virtualization enabled, which you must provision and register
  # yourself (see CONTRIBUTING.md). It intentionally does NOT run on
  # `push` or `pull_request` — self-hosted runners on a public repository
  # are a known attack vector when triggered by untrusted input (a PR from
  # any external contributor could otherwise execute arbitrary code on
  # your runner's network). This job only runs when a repository
  # maintainer manually triggers it from the Actions tab
  # (workflow_dispatch), which cannot be invoked by a pull request.
  # ---------------------------------------------------------------------------
  smoke-test-devops-lab:
    name: Self-Hosted Smoke Test (DevOps Lab)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, smoke-test]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision minimal profile (devops-1, worker-1)
        working-directory: labs/infrastructure/devops-linux-lab
        env:
          VAGRANT_DEFAULT_PROVIDER: ${{ inputs.provider }}
          LAB_PROFILE: minimal
        run: vagrant up

      - name: Wait for k3s and confirm the node is Ready
        working-directory: labs/infrastructure/devops-linux-lab
        run: |
          echo "Checking k3s service status on devops-1..."
          vagrant ssh devops-1 -c "sudo systemctl is-active k3s"

          echo "Waiting for the devops-1 node to report Ready..."
          for i in $(seq 1 20); do
            if vagrant ssh devops-1 -c "sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get node devops-1 -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'" 2>/dev/null | grep -qx "True"; then
              echo "Node is Ready."
              exit 0
            fi
            echo "Not ready yet, retrying ($i/20)..."
            sleep 15
          done

          echo "::error::devops-1 did not report Ready within the timeout." >&2
          exit 1

      - name: Tear down VMs
        if: always()
        working-directory: labs/infrastructure/devops-linux-lab
        env:
          VAGRANT_DEFAULT_PROVIDER: ${{ inputs.provider }}
        run: vagrant destroy -f || true
