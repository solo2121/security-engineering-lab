# =============================================================================
# Dependabot configuration — security-engineering-lab
# =============================================================================
# Ecosystems covered:
#   github-actions — action versions used in .github/workflows/
#   pip            — requirements-dev.txt and labs/security/requirements.txt
#
# Docker is not currently used in this repository (no Dockerfiles), so a
# docker ecosystem entry is intentionally omitted. Add one if/when a
# Dockerfile is introduced.
# =============================================================================

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # All github/codeql-action/* steps in a workflow must run the same
      # version, so they have to be bumped in a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "pip"
    directory: "/labs/security"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-security-lab)"
    labels:
      - "dependencies"
      - "python"
